<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1">
        <link rel="stylesheet" href="static/styles.css">
        <title>{% block title %}Home{% endblock %}</title>
    </head>
    <body>
        <div class="navbar-container">
            <ul id="navbar">
                <li class="navbar-element"><a class="navbar-link" href="/base">Home</a></li>
                <li class="navbar-element"><a class="navbar-link" href="/watchlist">My Watchlist</a></li>
                <li class="navbar-element"><a class="navbar-link" href="/login">Login</a></li>
                <li class="navbar-element"><a class="navbar-link" href="/signup">Signup</a></li>
                <li class="navbar-element"><a class="navbar-link" href="/logout">Logout</a></li>
            </ul>
        </div>

        <div>
            <!-- store the current inputted stock ticker in the session if valid -->
            <form method="POST">
                <input class="searchbar" type="search" name="searched" placeholder="Enter a valid stock ticker like AAPL">
            </form>
        </div>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <script>
                alert({{ message | tojson }});
            </script>
            {% endfor %}
        {% endif %}
        {% endwith %}
        <div class="container">
            {% block content %}{% endblock %}
        </div>

        <script src="static/index.js"></script>
    </body>
</html>
