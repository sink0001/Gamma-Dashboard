<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1">
        <link rel="stylesheet" href="{{ url_for('static', filename='auth/auth.css') }}">
        <title>Sign-up</title>
    </head>
    <body>
        <form id="signup-form" class="auth-form">
            <h1>Sign-up</h1>
            <input type="text" class="auth-form-input-field" name="username" placeholder="Username">
            <input type="text" class="auth-form-input-field" name="password" placeholder="Password">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAACVGLtBfRK0X2Vlk"></div>
            <button type="submit" id="signup-submit">Submit</button>
        </form>

        <script src="{{ url_for('static', filename='auth/signup.js') }}"></script>
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    </body>
</html>
