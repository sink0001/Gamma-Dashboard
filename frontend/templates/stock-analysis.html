{% extends "base.html" %}
{% block title %}Stock Analysis{% endblock %}

{% block head_content %}
    <link rel="stylesheet" href="{{ url_for('static', filename='stock_analysis/ratio_selector.css') }}">
{% endblock %}
{% block content %}
    <div class="ratio-selector">
        <div class="column">
            <button class="ratio-button">P/E ratio {{ pe_ratio }}</button>
            <button class="ratio-button">Debt to equity {{ debt_to_equity }}</button>
            <button class="ratio-button">FCF margin {{ fcf_margin }}</button>
        </div>
        <div class="column">
            <button class="ratio-button">P/B ratio {{ pb_ratio }}</button>
            <button class="ratio-button">Current ratio {{ current_ratio }}</button>
            <button class="ratio-button">Gross margin {{ gross_margin }}</button>
        </div>
        <div class="column">
            <button class="ratio-button">Dvidend yield {{ dividend_yield }}</button>
            <button class="ratio-button">Quick ratio {{ quick_ratio }}</button>
            <button class="ratio-button">Operating margin {{ operating_margin }}</button>
        </div>
        <div class="column">
            <button class="ratio-button">P/S ratio {{ ps_ratio }}</button>
            <button class="ratio-button">EBITDA margin {{ ebitda_margin }}</button>
            <button class="ratio-button">P/FCF {{ pfcf }}</button>
        </div>
        <div class="column">
            <button class="ratio-button">ROE {{ roe }}</button>
            <button class="ratio-button">ROA {{ roa }}</button>
            <button class="ratio-button">Cashflow to debt {{ cashflow_to_debt }}</button>
        </div>
    </div>
{% endblock %}
